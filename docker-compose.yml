services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: airrequest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: builder
    working_dir: /app
    command: /app/node_modules/.bin/prisma db push --skip-generate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/airrequest
      DIRECT_URL: postgresql://postgres:password@postgres:5432/airrequest
      PRISMA_SCHEMA_ENGINE_BINARY: /usr/local/bin/schema-engine
      PRISMA_QUERY_ENGINE_LIBRARY: /app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/airrequest
      DIRECT_URL: postgresql://postgres:password@postgres:5432/airrequest
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
