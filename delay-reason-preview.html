<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELAY REASON — Design Options</title>
<style>
  :root{
    --bg:#f2eef0; --surface:#ffffff; --surface-2:#faf7f8;
    --ink:#2b2429; --ink-2:#6f6469; --muted:#a29aa0; --line:#ece6e9; --track:#f0ebee;
    --brand:#a5332f;
    --r1:#9e2b2b; --r2:#c04f4a; --r3:#dc7d78; --r4:#eeb0ac;
    --rose-ink:#c2410c; --rose-bg:#fff1ec; --rose-line:#fcd9cd;
    --shadow:0 1px 2px rgba(40,20,25,.05),0 6px 20px rgba(40,20,25,.06);
    --font:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Thai",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#161217; --surface:#1f1a20; --surface-2:#241e26; --ink:#efe9ec; --ink-2:#b9aeb5;
      --muted:#7e737b; --line:#322b34; --track:#2b2430;
      --r1:#e98d88; --r2:#dc7570; --r3:#c65a55; --r4:#8f3f3c;
      --rose-ink:#fca877; --rose-bg:#3a2016; --rose-line:#5a3122;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --bg:#f2eef0; --surface:#ffffff; --surface-2:#faf7f8; --ink:#2b2429; --ink-2:#6f6469;
    --muted:#a29aa0; --line:#ece6e9; --track:#f0ebee;
    --r1:#9e2b2b; --r2:#c04f4a; --r3:#dc7d78; --r4:#eeb0ac;
    --rose-ink:#c2410c; --rose-bg:#fff1ec; --rose-line:#fcd9cd;
  }
  :root[data-theme="dark"]{
    --bg:#161217; --surface:#1f1a20; --surface-2:#241e26; --ink:#efe9ec; --ink-2:#b9aeb5;
    --muted:#7e737b; --line:#322b34; --track:#2b2430;
    --r1:#e98d88; --r2:#dc7570; --r3:#c65a55; --r4:#8f3f3c;
    --rose-ink:#fca877; --rose-bg:#3a2016; --rose-line:#5a3122;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
  .bar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .page-head h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
  .page-head p{color:var(--ink-2);font-size:13.5px;margin:6px 0 0;max-width:60ch}
  .toggle{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .opt{display:flex;flex-direction:column}
  .opt-tag{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .opt-num{font-size:11px;font-weight:800;color:#fff;background:var(--brand);width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
  .opt-name{font-size:13px;font-weight:700}
  .opt-note{font-size:11.5px;color:var(--muted)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);flex:1}
  .panel-title{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--brand);text-transform:uppercase;margin:0 0 12px}
  .sub{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:12px}
  .sub b{color:var(--ink-2)}
  .tnum{font-variant-numeric:tabular-nums}
  .chip{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--rose-ink);background:var(--rose-bg);border:1px solid var(--rose-line);border-radius:5px;padding:2px 6px;text-transform:uppercase;white-space:nowrap}
  .rows{display:flex;flex-direction:column;gap:14px}
  .row .row-top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:6px}
  .row-name{display:flex;align-items:center;gap:6px;min-width:0}
  .row-name .txt{font-size:13px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row-val{display:flex;align-items:baseline;gap:6px;flex-shrink:0}
  .row-val .q{font-size:13px;font-weight:800}
  .row-val .p{font-size:11px;color:var(--muted);width:34px;text-align:right}
  .track{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
  .fill{height:100%;border-radius:99px}
  .donutwrap{display:flex;align-items:center;gap:18px}
  .donut{width:132px;height:132px;border-radius:50%;flex-shrink:0;position:relative}
  .donut::after{content:"";position:absolute;inset:22px;background:var(--surface);border-radius:50%}
  .donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
  .donut .center .big{font-size:26px;font-weight:800;line-height:1}
  .donut .center .lbl{font-size:10px;color:var(--muted);margin-top:2px}
  .legend{flex:1;display:flex;flex-direction:column;gap:11px;min-width:0}
  .lg{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .lg .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .lg .q{font-weight:800}.lg .p{color:var(--muted);width:30px;text-align:right;font-size:11px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;overflow:hidden}
  .card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
  .card .dept{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .card .q{font-size:22px;font-weight:800;margin:5px 0 1px;letter-spacing:-.02em}
  .card .rsn{font-size:10.5px;color:var(--muted);line-height:1.35;height:2.7em;overflow:hidden}
  .card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .card .p{font-size:11px;font-weight:700;color:var(--ink-2)}
  .mini{height:5px;width:52px;border-radius:99px;background:var(--track);overflow:hidden}
  .mini > div{height:100%;border-radius:99px}
  .sharebar{display:flex;height:30px;border-radius:8px;overflow:hidden;gap:2px}
  .seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;min-width:22px}
  .sharelegend{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .sl{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .sl .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .sl .q{font-weight:800}.sl .p{color:var(--muted);width:30px;text-align:right;font-size:11px}
  .foot-note{margin-top:36px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="page-head">
      <h1>DELAY REASON — ตัวอย่างดีไซน์ 4 แบบ</h1>
      <p>ตัวอย่างสำหรับเลือก (ยังไม่ deploy) — ใช้ข้อมูลจริงโหมด Reason (จำนวนชิ้น). เลือกเบอร์ที่ชอบแล้วบอกได้เลย</p>
    </div>
    <button class="toggle" id="tgl">◐ สลับ Light / Dark</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="foot-note">แบบไหนโดนใจ บอกเบอร์ (1–4) หรือขอผสม/ปรับเพิ่มได้ครับ</p>
</div>
<script>
  const REASONS = [
    { reason:"Release Bom delay, information incorrect", dept:"Commercial", qty:125603, color:"var(--r1)" },
    { reason:"Quality issue, size spec, workmanship, delay", dept:"Production", qty:122744, color:"var(--r2)" },
    { reason:"Fabric issue, delay", dept:"NYK", qty:46999, color:"var(--r3)" },
    { reason:"Supplier delay, Quality issue", dept:"Procurement", qty:19301, color:"var(--r4)" },
  ];
  const total = REASONS.reduce((s,r)=>s+r.qty,0);
  const maxQ = Math.max(...REASONS.map(r=>r.qty));
  const fmt = n => n.toLocaleString("en-US");
  const pct = q => (q/total*100);
  const panel = (inner) => `<div class="panel"><p class="panel-title">Delay Reason</p>${inner}</div>`;

  const opt1 = panel(`
    <div class="sub"><span><b>${REASONS.length}</b> reasons</span><span><b>${fmt(total)}</b> pcs total</span></div>
    <div class="rows">${REASONS.map(r=>`
      <div class="row">
        <div class="row-top">
          <div class="row-name"><span class="txt" title="${r.reason}">${r.reason}</span><span class="chip">${r.dept}</span></div>
          <div class="row-val"><span class="q tnum">${fmt(r.qty)}</span><span class="p tnum">${pct(r.qty).toFixed(0)}%</span></div>
        </div>
        <div class="track"><div class="fill" style="width:${Math.max(2,r.qty/maxQ*100)}%;background:${r.color}"></div></div>
      </div>`).join("")}</div>`);

  let acc=0; const stops = REASONS.map(r=>{ const a=acc; acc+=pct(r.qty); return `${r.color} ${a}% ${acc}%`; }).join(",");
  const opt2 = panel(`
    <div class="donutwrap">
      <div class="donut" style="background:conic-gradient(${stops})">
        <div class="center"><span class="big tnum">${REASONS.length}</span><span class="lbl">reasons</span></div>
      </div>
      <div class="legend">${REASONS.map(r=>`
        <div class="lg"><span class="dot" style="background:${r.color}"></span>
          <span class="txt" title="${r.reason}">${r.reason}</span><span class="chip">${r.dept}</span>
          <span class="q tnum">${fmt(r.qty)}</span><span class="p tnum">${pct(r.qty).toFixed(0)}%</span></div>`).join("")}</div>
    </div>`);

  const opt3 = panel(`
    <div class="sub"><span>by claim department</span><span><b>${fmt(total)}</b> pcs</span></div>
    <div class="cards">${REASONS.map(r=>`
      <div class="card"><div class="stripe" style="background:${r.color}"></div>
        <div class="dept">${r.dept}</div><div class="q tnum">${fmt(r.qty)}</div><div class="rsn">${r.reason}</div>
        <div class="foot"><span class="p tnum">${pct(r.qty).toFixed(0)}%</span><span class="mini"><div style="width:${Math.max(4,r.qty/maxQ*100)}%;background:${r.color}"></div></span></div>
      </div>`).join("")}</div>`);

  const opt4 = panel(`
    <div class="sub"><span>share of pieces</span><span><b>${fmt(total)}</b> pcs total</span></div>
    <div class="sharebar">${REASONS.map(r=>`<div class="seg tnum" title="${r.dept}: ${fmt(r.qty)}" style="flex:${r.qty};background:${r.color}">${pct(r.qty)>=8?pct(r.qty).toFixed(0)+"%":""}</div>`).join("")}</div>
    <div class="sharelegend">${REASONS.map(r=>`
      <div class="sl"><span class="dot" style="background:${r.color}"></span>
        <span class="txt" title="${r.reason}">${r.reason}</span><span class="chip">${r.dept}</span>
        <span class="q tnum">${fmt(r.qty)}</span><span class="p tnum">${pct(r.qty).toFixed(0)}%</span></div>`).join("")}</div>`);

  const OPTS = [
    ["Ranked bars", "แถบแนวนอนเรียงอันดับ (แบบที่ deploy ตอนนี้) — อ่าน magnitude ง่าย", opt1],
    ["Donut + legend", "โดนัทใหญ่ + รายการข้าง — เห็นสัดส่วนภาพรวม", opt2],
    ["Department cards", "การ์ดต่อ dept — ตัวเลขเด่น เหมาะโชว์เป็น KPI", opt3],
    ["100% share bar", "แถบสัดส่วนเดียว — เปรียบเทียบส่วนแบ่งชัด", opt4],
  ];
  document.getElementById("grid").innerHTML = OPTS.map(([name,note,html],i)=>`
    <div class="opt"><div class="opt-tag"><span class="opt-num">${i+1}</span><span class="opt-name">${name}</span></div>
      ${html}<p class="opt-note" style="margin-top:8px">${note}</p></div>`).join("");

  const tgl=document.getElementById("tgl");
  tgl.onclick=()=>{ const cur=document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    document.documentElement.setAttribute("data-theme", cur==="dark"?"light":"dark"); };
</script>
</body>
</html>
